# Cargo configuration for jobs that run tests against a real NDI runtime:
#
#   cargo test --config ci/offline.toml --all-features
#
# On Linux and macOS every test executable is started through a wrapper that
# leaves it loopback networking only, so SDK senders and finders created by
# tests never announce on, or connect to, the network the machine is attached
# to. Windows has no such wrapper: there the SDK's receivers need multicast DNS,
# so the tests run as they would on any Windows machine (ci/README.md,
# "Windows").
#
# Relative runner paths resolve against the repository root.

[target.'cfg(target_os = "linux")']
runner = ["ci/offline/linux.sh"]

[target.'cfg(target_os = "macos")']
runner = ["ci/offline/macos.sh"]
