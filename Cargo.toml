[package]
name = "grafton-ndi"
version = "3.0.0"
edition = "2021"
rust-version = "1.88"
build = "build.rs"
authors = ["Grant Sparks <grant@grafton.ai>"]
description = "High-performance Rust bindings for the NDI® 6 SDK - real-time IP video streaming"
license = "Apache-2.0"
repository = "https://github.com/GrantSparks/grafton-ndi"
homepage = "https://www.grafton.ai"
documentation = "https://docs.rs/grafton-ndi"
categories = ["api-bindings", "multimedia::video", "network-programming"]
keywords = ["ndi", "video", "streaming", "broadcast", "realtime"]
readme = "README.md"
include = [
    "/src/**",
    "/examples/**",
    "/build.rs",
    "/build_apple.rs",
    "/build_support.rs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[package.metadata.docs.rs]
all-features = true

[workspace]
members = ["xtask"]

[dependencies]
parking_lot = "0.12"
num_enum = "0.7.6"
thiserror = "2.0.21"
libloading = "0.9.0"
serde_json = { version = "1.0", optional = true }

# Optional dependencies for image-encoding feature
# Keep the scalar base64 0.22 engine; SIMD adoption needs separate validation.
base64 = { version = "0.22", optional = true }
jpeg-encoder = { version = "0.7.1", optional = true }
png = { version = "0.18", optional = true }

# Optional dependencies for async runtime integration
tokio = { version = "1.53.3", optional = true, features = ["rt", "rt-multi-thread", "sync", "macros"] }
smol = { version = "2.0.2", optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[build-dependencies]
# Used only by the `advanced` feature, to generate declarations for the
# Advanced-only headers of an installed Advanced SDK. Keep in step with xtask.
bindgen = { version = "0.72.1", optional = true }

[features]
default = ["image-encoding"]
# Opt-in Advanced SDK wrappers. Their native declarations are generated at build
# time from an installed Advanced SDK (NDI_SDK_DIR or a default location); without
# one the API still compiles and every operation reports that it is unavailable.
advanced = ["dep:serde_json", "dep:bindgen"]
# Optional source recording and file-to-network playback API.
file-io = []
# Enable image encoding support (PNG, JPEG, data URLs).
# Enabled by default. Use `default-features = false` for a minimal build.
image-encoding = ["dep:base64", "dep:jpeg-encoder", "dep:png"]
# Enable async runtime integration for Tokio
# Adds dependency: tokio
tokio = ["dep:tokio"]
# Enable async runtime integration for smol
# Adds dependency: smol
smol = ["dep:smol"]

[dev-dependencies]
ctrlc = "3.5"
trybuild = "1.0.122"
syn = { version = "2", features = ["full"] }

[[example]]
name = "NDIlib_Recv_PNG"
required-features = ["image-encoding"]

[[example]]
name = "advanced_allocator"
required-features = ["advanced"]

[[example]]
name = "advanced_avsync"
required-features = ["advanced"]

[[example]]
name = "advanced_genlock"
required-features = ["advanced"]

[[example]]
name = "advanced_kvm"
required-features = ["advanced"]

[[example]]
name = "advanced_passthrough"
required-features = ["advanced"]

[[example]]
name = "advanced_queued_send"
required-features = ["advanced"]

[[example]]
name = "advanced_source_metadata"
required-features = ["advanced"]

[[example]]
name = "file_play"
required-features = ["file-io"]

[[example]]
name = "file_record"
required-features = ["file-io"]
