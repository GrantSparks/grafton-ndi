[package]
name = "grafton-ndi"
version = "2.0.0"
edition = "2021"
rust-version = "1.88"
build = "build.rs"
authors = ["Grant Sparks <grant@grafton.ai>"]
description = "High-performance Rust bindings for the NDI® 6 SDK - real-time IP video streaming"
license = "Apache-2.0"
repository = "https://github.com/GrantSparks/grafton-ndi"
homepage = "https://www.grafton.ai"
# Building this crate runs bindgen against an installed NDI SDK. The docs.rs
# environment lacks that installation, so API docs are built and hosted from CI.
documentation = "https://grantsparks.github.io/grafton-ndi/grafton_ndi/"
categories = ["api-bindings", "multimedia::video", "network-programming"]
keywords = ["ndi", "video", "streaming", "broadcast", "realtime"]
readme = "README.md"
exclude = ["target/", ".gitignore", ".github/", "NDI_6_SDK.zip", "docs/"]

[dependencies]
parking_lot = "0.12"
num_enum = "0.7.6"
thiserror = "2.0.21"

# Optional dependencies for image-encoding feature
# Keep the scalar base64 0.22 engine; SIMD adoption needs separate validation.
base64 = { version = "0.22", optional = true }
jpeg-encoder = { version = "0.7.1", optional = true }
png = { version = "0.18", optional = true }

# Optional dependencies for async runtime integration
tokio = { version = "1.53.3", optional = true, features = ["rt", "rt-multi-thread", "sync", "macros"] }
smol = { version = "2.0.2", optional = true }

[build-dependencies]
# Defer 0.73 until mixed syn/prettyplease consumer resolutions are validated.
bindgen = "0.72.1"

[features]
default = ["image-encoding"]
# Retained compatibility flag; SDK linkage is selected by NDI_SDK_DIR.
# Video sending uses default SDK synchronization with either SDK.
advanced_sdk = []
# Enable image encoding support (PNG, JPEG, data URLs).
# Enabled by default. Use `default-features = false` for a minimal build.
image-encoding = ["dep:base64", "dep:jpeg-encoder", "dep:png"]
# Enable async runtime integration for Tokio
# Adds dependency: tokio
tokio = ["dep:tokio"]
# Enable async runtime integration for smol
# Adds dependency: smol
smol = ["dep:smol"]

[dev-dependencies]
ctrlc = "3.5"
trybuild = "1.0.122"

[[example]]
name = "NDIlib_Recv_PNG"
required-features = ["image-encoding"]
