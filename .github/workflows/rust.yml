name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      NDI_SDK_SOURCES_JSON:
        required: false
      NDI_SDK_ARCHIVE_TOKEN:
        required: false

permissions:
  contents: read

# A new push to a pull request replaces its running check. Runs for main, for
# manual dispatches and for releases are never cancelled or queued behind each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  # The crate builds without an NDI SDK, so everything in lint, test and cross
  # runs for every event, including pull requests from forks.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: CI scripts and workflows
        run: |
          python -m unittest discover -s ci/tests
          shellcheck ci/*.sh ci/offline/*.sh scripts/*.sh
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          for features in "" image-encoding tokio smol advanced file-io advanced,file-io; do
            cargo clippy --locked --all-targets --no-default-features ${features:+--features "$features"} -- -D warnings
          done
      - name: Bindings generator tests
        run: cargo test --locked --package xtask
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - name: Minimum supported Rust version
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --locked --workspace --all-targets --all-features
      - name: Packaged crate builds
        run: cargo package --locked --package grafton-ndi
      # Skipped while the crate's major version is ahead of every published
      # release: nothing constrains a new major version, and the old release
      # needs an NDI SDK to build.
      - name: Semver check against the last release
        run: python ci/semver.py
      - name: Dependency advisories
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit --deny warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # No NDI runtime is installed here: tests that need one report a skip.
      - name: Tests, all features
        run: cargo test --locked --all-features
      - name: Tests, default features
        run: cargo test --locked

  cross:
    name: cross
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGETS: >-
        aarch64-unknown-linux-gnu armv7-unknown-linux-gnueabihf i686-unknown-linux-gnu
        aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
        x86_64-pc-windows-msvc i686-pc-windows-msvc
        aarch64-apple-darwin x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy for every dynamically loaded target
        run: |
          read -r -a targets <<< "$TARGETS"
          rustup target add "${targets[@]}"
          failed=()
          for target in "${targets[@]}"; do
            cargo clippy --locked --all-targets --all-features --target "$target" -- -D warnings || failed+=("$target")
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::clippy failed for: ${failed[*]}"
            exit 1
          fi
      - name: Link the examples for Android
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-android.sh aarch64-linux-android

  # This job needs the private SDK archives, so it runs only where the secrets
  # exist: not for pull requests from forks, and not for Dependabot, whose runs
  # are given none. The repository variable NDI_CI_RELEASED switches it on, and
  # required-ci treats a skip anywhere else as a failure.
  #
  # The job as a whole is the trust boundary for those secrets. Only the
  # provisioning step is given them in its environment, but every step runs on
  # the machine they were sent to, with administrator rights: the tests, every
  # build script and procedural macro in Cargo.lock, and whatever a step installs.
  #
  # No dependency cache and no uploads: SDK files and the Advanced bindings
  # generated into the target directory must stay on the runner.
  sdk:
    name: sdk (${{ matrix.name }})
    if: >-
      vars.NDI_CI_RELEASED == 'true' && github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      # `require` lists what the row's SDK lets an all-features build check. The
      # tests read it from GRAFTON_NDI_REQUIRE_RUNTIME and fail where they would
      # otherwise skip:
      #   1                 an NDI runtime (implied by every other entry)
      #   advanced          an Advanced runtime, compiled with its headers
      #   file              a File library the selected runtime can drive
      #   discovery-server  the SDK's Discovery Server program (Linux, 6.4)
      # Each step promises exactly what its build can check. A build without the
      # advanced and file-io features can check only the first and the last, so
      # the no-default-features step promises `require-no-default`, or `1` in a
      # row that does not set it.
      matrix:
        include:
          - name: linux-x64 standard-6.3.2
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: 6.3.2-standard-linux
            require: '1'
          - name: linux-x64 standard-6.4
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: current-standard-linux
            require: 1,discovery-server
            require-no-default: 1,discovery-server
            bindings: true
          - name: linux-x64 advanced-6.4
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: current-advanced-linux
            require: advanced,file,discovery-server
            require-no-default: 1,discovery-server
          - name: linux-x86 standard-6.4
            runner: ubuntu-24.04
            target: i686-unknown-linux-gnu
            package: current-standard-linux
            require: 1,discovery-server
            require-no-default: 1,discovery-server
          - name: linux-arm64 standard-6.4
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: current-standard-linux
            require: 1,discovery-server
            require-no-default: 1,discovery-server
          - name: windows-x64 standard-6.3.2
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            package: 6.3.2-standard-windows
            require: '1'
          - name: windows-x64 standard-6.4
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            package: current-standard-windows
            require: 1,file
          - name: windows-x64 advanced-6.4
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            package: current-advanced-windows
            require: advanced,file
          - name: windows-x86 advanced-6.4
            runner: windows-2025
            target: i686-pc-windows-msvc
            package: current-advanced-windows
            require: advanced
          - name: macos-arm64 standard-6.3.2
            runner: macos-15
            target: aarch64-apple-darwin
            package: 6.3.2-standard-apple
            require: '1'
          - name: macos-arm64 standard-6.4
            runner: macos-15
            target: aarch64-apple-darwin
            package: current-standard-apple
            require: '1'
            apple-mobile: true
          - name: macos-arm64 advanced-6.4
            runner: macos-15
            target: aarch64-apple-darwin
            package: current-advanced-apple
            require: advanced,file
            apple-mobile: true
          - name: macos-x64 standard-6.4
            runner: macos-15-intel
            target: x86_64-apple-darwin
            package: current-standard-apple
            require: '1'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap libavahi-client3 libclang-dev
          # Ubuntu 24.04 denies the unprivileged user namespace that bwrap needs.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: 32-bit Linux linker and runtime dependencies
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-multilib libc6-dev:i386 libavahi-client3:i386
      - name: Windows libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files\LLVM\bin\clang.exe')) { choco install llvm --version=20.1.8 -y }
          'LIBCLANG_PATH=C:\Program Files\LLVM\bin' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      # The only step that is given the acquisition secrets. It exports
      # NDI_SDK_DIR and NDI_RUNTIME_DIR_V6 for the steps that follow.
      - name: Provision the SDK
        env:
          NDI_SDK_SOURCES_JSON: ${{ secrets.NDI_SDK_SOURCES_JSON }}
          NDI_SDK_ARCHIVE_TOKEN: ${{ secrets.NDI_SDK_ARCHIVE_TOKEN }}
        run: python ci/sdk.py install "$PACKAGE" --dest "$RUNNER_TEMP/ndi-sdk" --target "$TARGET" --github-env "$GITHUB_ENV"
      - name: Test runner leaves loopback networking only
        run: |
          python ci/offline/check.py --online
          case "$RUNNER_OS" in
            Linux) ci/offline/linux.sh python3 ci/offline/check.py ;;
            macOS) ci/offline/macos.sh python3 ci/offline/check.py ;;
            Windows) pwsh -NoProfile -File ci/offline/windows.ps1 "$(python -c 'import sys; sys.stdout.write(sys.executable)')" ci/offline/check.py ;;
          esac
      - name: Tests against the real runtime, all features
        env:
          GRAFTON_NDI_REQUIRE_RUNTIME: ${{ matrix.require }}
        run: cargo test --locked --config ci/offline.toml --target "$TARGET" --all-features
      - name: Tests against the real runtime, no default features
        env:
          GRAFTON_NDI_REQUIRE_RUNTIME: ${{ matrix.require-no-default || '1' }}
        run: cargo test --locked --config ci/offline.toml --target "$TARGET" --no-default-features
      # Without the Advanced headers the advanced feature compiles to stubs, so
      # only a build that has them lints and documents the real implementation.
      - name: Lint and document the Advanced implementation
        if: contains(matrix.package, 'advanced')
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          cargo clippy --locked --all-targets --target "$TARGET" --all-features -- -D warnings
          cargo clippy --locked --all-targets --target "$TARGET" --no-default-features --features advanced -- -D warnings
          cargo clippy --locked --all-targets --target "$TARGET" --no-default-features --features advanced,file-io -- -D warnings
          cargo doc --locked --no-deps --target "$TARGET" --all-features
      - name: Vendored bindings are current
        if: matrix.bindings
        run: cargo xtask bindgen --check --sdk "$NDI_SDK_DIR"
      - name: Build for the statically linked Apple mobile targets
        if: matrix.apple-mobile
        run: ci/apple-mobile.sh

  required-ci:
    name: required-ci
    if: always()
    needs: [lint, test, cross, sdk]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every job this event requires succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          # The condition of the sdk job, without the switch that turns it on.
          SDK_EXPECTED: >-
            ${{ github.actor != 'dependabot[bot]' &&
            (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: python3 ci/gate.py
