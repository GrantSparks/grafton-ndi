name: Rust CI

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      scope:
        description: Required family checks or the extended SDK upgrade audit
        type: choice
        options: [required, extended]
        default: required
  workflow_call:
    inputs:
      scope:
        type: string
        default: required

permissions:
  contents: read

concurrency:
  group: rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: never
  NDI_VALIDATION_SCOPE: ${{ inputs.scope || 'required' }}

jobs:
  policy:
    name: CI policy and SDK tooling tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: sudo apt-get update && sudo apt-get install --yes clang llvm
      - run: python -m unittest discover -s ci/tests -v
      - run: python -m unittest discover -s tools/sdk -v
      - run: python tools/sdk/audit.py emit-capabilities --check

  format:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Enable SDK validation explicitly. Publication independently requires a
  # successful gate and a trusted main/tag event; pull requests cannot publish.
  plan:
    name: Exact SDK validation plan
    if: >-
      vars.NDI_CI_RELEASED == 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo generate-lockfile
      - id: plan
        name: Generate the public matrix without acquisition secrets
        run: python ci/plan.py --scope "$NDI_VALIDATION_SCOPE" --require-provisioning --output ci-plan.json --github-output "$GITHUB_OUTPUT"
      - name: Audit the exact dependency resolution used by every cell
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit --deny warnings
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-plan
          path: |
            ci-plan.json
            Cargo.lock
          if-no-files-found: error
          retention-days: 7

  sources:
    name: Verify private SDK source configuration
    needs: plan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-plan
          path: .
      # Credentialed jobs must not emit matrix outputs: multiline secrets can
      # register common JSON fragments with GitHub's output secret masker.
      - name: Check all SDK sources against the exact plan
        env:
          NDI_SDK_SOURCES_JSON: ${{ secrets.NDI_SDK_SOURCES_JSON }}
          NDI_SDK_ARCHIVE_TOKEN: ${{ secrets.NDI_SDK_ARCHIVE_TOKEN }}
          NDI_SDK_6_3_2_STANDARD_ANDROID_URL: ${{ secrets.NDI_SDK_6_3_2_STANDARD_ANDROID_URL }}
          NDI_SDK_6_3_2_STANDARD_ANDROID_SHA256: ${{ vars.NDI_SDK_6_3_2_STANDARD_ANDROID_SHA256 }}
          NDI_SDK_6_3_2_STANDARD_APPLE_URL: ${{ secrets.NDI_SDK_6_3_2_STANDARD_APPLE_URL }}
          NDI_SDK_6_3_2_STANDARD_APPLE_SHA256: ${{ vars.NDI_SDK_6_3_2_STANDARD_APPLE_SHA256 }}
          NDI_SDK_6_3_2_STANDARD_LINUX_URL: ${{ secrets.NDI_SDK_6_3_2_STANDARD_LINUX_URL }}
          NDI_SDK_6_3_2_STANDARD_LINUX_SHA256: ${{ vars.NDI_SDK_6_3_2_STANDARD_LINUX_SHA256 }}
          NDI_SDK_6_3_2_STANDARD_WINDOWS_URL: ${{ secrets.NDI_SDK_6_3_2_STANDARD_WINDOWS_URL }}
          NDI_SDK_6_3_2_STANDARD_WINDOWS_SHA256: ${{ vars.NDI_SDK_6_3_2_STANDARD_WINDOWS_SHA256 }}
          NDI_SDK_CURRENT_ADVANCED_ANDROID_URL: ${{ secrets.NDI_SDK_CURRENT_ADVANCED_ANDROID_URL }}
          NDI_SDK_CURRENT_ADVANCED_ANDROID_SHA256: ${{ vars.NDI_SDK_CURRENT_ADVANCED_ANDROID_SHA256 }}
          NDI_SDK_CURRENT_ADVANCED_APPLE_URL: ${{ secrets.NDI_SDK_CURRENT_ADVANCED_APPLE_URL }}
          NDI_SDK_CURRENT_ADVANCED_APPLE_SHA256: ${{ vars.NDI_SDK_CURRENT_ADVANCED_APPLE_SHA256 }}
          NDI_SDK_CURRENT_ADVANCED_LINUX_URL: ${{ secrets.NDI_SDK_CURRENT_ADVANCED_LINUX_URL }}
          NDI_SDK_CURRENT_ADVANCED_LINUX_SHA256: ${{ vars.NDI_SDK_CURRENT_ADVANCED_LINUX_SHA256 }}
          NDI_SDK_CURRENT_ADVANCED_WINDOWS_URL: ${{ secrets.NDI_SDK_CURRENT_ADVANCED_WINDOWS_URL }}
          NDI_SDK_CURRENT_ADVANCED_WINDOWS_SHA256: ${{ vars.NDI_SDK_CURRENT_ADVANCED_WINDOWS_SHA256 }}
          NDI_SDK_CURRENT_STANDARD_ANDROID_URL: ${{ secrets.NDI_SDK_CURRENT_STANDARD_ANDROID_URL }}
          NDI_SDK_CURRENT_STANDARD_ANDROID_SHA256: ${{ vars.NDI_SDK_CURRENT_STANDARD_ANDROID_SHA256 }}
          NDI_SDK_CURRENT_STANDARD_APPLE_URL: ${{ secrets.NDI_SDK_CURRENT_STANDARD_APPLE_URL }}
          NDI_SDK_CURRENT_STANDARD_APPLE_SHA256: ${{ vars.NDI_SDK_CURRENT_STANDARD_APPLE_SHA256 }}
          NDI_SDK_CURRENT_STANDARD_LINUX_URL: ${{ secrets.NDI_SDK_CURRENT_STANDARD_LINUX_URL }}
          NDI_SDK_CURRENT_STANDARD_LINUX_SHA256: ${{ vars.NDI_SDK_CURRENT_STANDARD_LINUX_SHA256 }}
          NDI_SDK_CURRENT_STANDARD_WINDOWS_URL: ${{ secrets.NDI_SDK_CURRENT_STANDARD_WINDOWS_URL }}
          NDI_SDK_CURRENT_STANDARD_WINDOWS_SHA256: ${{ vars.NDI_SDK_CURRENT_STANDARD_WINDOWS_SHA256 }}
        run: |
          python ci/plan.py --scope "$NDI_VALIDATION_SCOPE" --require-provisioning --require-sources --preflight-output "$RUNNER_TEMP/sdk-configuration.json" --output "$RUNNER_TEMP/source-plan.json"
          python - <<'PY_COMPARE'
          import json, os
          from pathlib import Path
          original = json.loads(Path('ci-plan.json').read_text())
          checked = json.loads((Path(os.environ['RUNNER_TEMP']) / 'source-plan.json').read_text())
          if original != checked:
              raise SystemExit('Credentialed source check differs from the frozen public plan')
          PY_COMPARE
      - name: Upload bounded configuration report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sdk-configuration
          path: ${{ runner.temp }}/sdk-configuration.json
          if-no-files-found: error
          retention-days: 7

  sdk:
    name: ${{ matrix.id }}
    needs: [plan, sources]
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      NDI_CI_RELEASED: ${{ vars.NDI_CI_RELEASED }}
      NDI_SDK_SOURCES_JSON: ${{ secrets.NDI_SDK_SOURCES_JSON }}
      NDI_SDK_ARCHIVE_TOKEN: ${{ secrets.NDI_SDK_ARCHIVE_TOKEN }}
      NDI_SDK_6_3_2_STANDARD_ANDROID_URL: ${{ secrets.NDI_SDK_6_3_2_STANDARD_ANDROID_URL }}
      NDI_SDK_6_3_2_STANDARD_ANDROID_SHA256: ${{ vars.NDI_SDK_6_3_2_STANDARD_ANDROID_SHA256 }}
      NDI_SDK_6_3_2_STANDARD_APPLE_URL: ${{ secrets.NDI_SDK_6_3_2_STANDARD_APPLE_URL }}
      NDI_SDK_6_3_2_STANDARD_APPLE_SHA256: ${{ vars.NDI_SDK_6_3_2_STANDARD_APPLE_SHA256 }}
      NDI_SDK_6_3_2_STANDARD_LINUX_URL: ${{ secrets.NDI_SDK_6_3_2_STANDARD_LINUX_URL }}
      NDI_SDK_6_3_2_STANDARD_LINUX_SHA256: ${{ vars.NDI_SDK_6_3_2_STANDARD_LINUX_SHA256 }}
      NDI_SDK_6_3_2_STANDARD_WINDOWS_URL: ${{ secrets.NDI_SDK_6_3_2_STANDARD_WINDOWS_URL }}
      NDI_SDK_6_3_2_STANDARD_WINDOWS_SHA256: ${{ vars.NDI_SDK_6_3_2_STANDARD_WINDOWS_SHA256 }}
      NDI_SDK_CURRENT_ADVANCED_ANDROID_URL: ${{ secrets.NDI_SDK_CURRENT_ADVANCED_ANDROID_URL }}
      NDI_SDK_CURRENT_ADVANCED_ANDROID_SHA256: ${{ vars.NDI_SDK_CURRENT_ADVANCED_ANDROID_SHA256 }}
      NDI_SDK_CURRENT_ADVANCED_APPLE_URL: ${{ secrets.NDI_SDK_CURRENT_ADVANCED_APPLE_URL }}
      NDI_SDK_CURRENT_ADVANCED_APPLE_SHA256: ${{ vars.NDI_SDK_CURRENT_ADVANCED_APPLE_SHA256 }}
      NDI_SDK_CURRENT_ADVANCED_LINUX_URL: ${{ secrets.NDI_SDK_CURRENT_ADVANCED_LINUX_URL }}
      NDI_SDK_CURRENT_ADVANCED_LINUX_SHA256: ${{ vars.NDI_SDK_CURRENT_ADVANCED_LINUX_SHA256 }}
      NDI_SDK_CURRENT_ADVANCED_WINDOWS_URL: ${{ secrets.NDI_SDK_CURRENT_ADVANCED_WINDOWS_URL }}
      NDI_SDK_CURRENT_ADVANCED_WINDOWS_SHA256: ${{ vars.NDI_SDK_CURRENT_ADVANCED_WINDOWS_SHA256 }}
      NDI_SDK_CURRENT_STANDARD_ANDROID_URL: ${{ secrets.NDI_SDK_CURRENT_STANDARD_ANDROID_URL }}
      NDI_SDK_CURRENT_STANDARD_ANDROID_SHA256: ${{ vars.NDI_SDK_CURRENT_STANDARD_ANDROID_SHA256 }}
      NDI_SDK_CURRENT_STANDARD_APPLE_URL: ${{ secrets.NDI_SDK_CURRENT_STANDARD_APPLE_URL }}
      NDI_SDK_CURRENT_STANDARD_APPLE_SHA256: ${{ vars.NDI_SDK_CURRENT_STANDARD_APPLE_SHA256 }}
      NDI_SDK_CURRENT_STANDARD_LINUX_URL: ${{ secrets.NDI_SDK_CURRENT_STANDARD_LINUX_URL }}
      NDI_SDK_CURRENT_STANDARD_LINUX_SHA256: ${{ vars.NDI_SDK_CURRENT_STANDARD_LINUX_SHA256 }}
      NDI_SDK_CURRENT_STANDARD_WINDOWS_URL: ${{ secrets.NDI_SDK_CURRENT_STANDARD_WINDOWS_URL }}
      NDI_SDK_CURRENT_STANDARD_WINDOWS_SHA256: ${{ vars.NDI_SDK_CURRENT_STANDARD_WINDOWS_SHA256 }}
      GROUP_ID: ${{ matrix.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-plan
          path: .
      - name: Linux host tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang llvm libclang-dev pkg-config libavahi-client-dev bubblewrap dbus avahi-daemon ffmpeg
      - name: Native Linux 32-bit runtime and linker
        if: matrix.needs_multilib
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes gcc-multilib g++-multilib libc6-dev:i386 libavahi-client-dev:i386
      - name: Permit isolated Linux test namespaces
        if: runner.os == 'Linux'
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Windows LLVM
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files\LLVM\bin\clang.exe')) {
            choco install llvm --version=20.1.8 -y
          }
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue)) { choco install ffmpeg -y }
          'C:\Program Files\LLVM\bin' | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          'LIBCLANG_PATH=C:\Program Files\LLVM\bin' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Apple LLVM object inspection tools
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm ffmpeg
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Android NDK
        if: matrix.android
        shell: bash
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.3.13750724' 'build-tools;35.0.0' 'platforms;android-35'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - name: Enable Android emulator acceleration
        if: matrix.emulator_api
        run: |
          sudo chmod 666 /dev/kvm
      - name: Android emulator lifecycle and package validation
        if: matrix.emulator_api
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.emulator_api }}
          arch: ${{ matrix.emulator_arch }}
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect
          script: python ci/batch.py --plan ci-plan.json --group "$GROUP_ID" --output "$RUNNER_TEMP/ndi-ci" --install-toolchain
      - name: Build, prove ABI, and execute the declared suite
        if: ${{ !matrix.emulator_api }}
        shell: bash
        run: python ci/batch.py --plan ci-plan.json --group "$GROUP_ID" --output "$RUNNER_TEMP/ndi-ci" --install-toolchain
      # Only individually verified bounded records enter evidence/. SDKs, generated
      # bindings, build outputs and raw diagnostics stay in separate private paths.
      - name: Upload result evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sdk-evidence-${{ matrix.id }}
          path: ${{ runner.temp }}/ndi-ci/evidence/
          if-no-files-found: error
          retention-days: 7

  required-ci:
    name: Required hosted SDK gate
    if: always()
    needs: [policy, format, plan, sources, sdk]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Require every declared prerequisite
        env:
          POLICY: ${{ needs.policy.result }}
          FORMAT: ${{ needs.format.result }}
          PLAN: ${{ needs.plan.result }}
          SOURCES: ${{ needs.sources.result }}
          SDK: ${{ needs.sdk.result }}
        run: |
          python - <<'PY'
          import os
          failed = [name for name in ('POLICY', 'FORMAT', 'PLAN', 'SOURCES', 'SDK') if os.environ[name] != 'success']
          if failed:
              raise SystemExit('Required CI did not pass (disabled/skipped is not a release pass): ' + ', '.join(failed))
          PY
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-plan
          path: ${{ runner.temp }}/ndi-aggregate/plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: sdk-evidence-*
          path: ${{ runner.temp }}/ndi-aggregate/evidence
      - run: python ci/aggregate.py --plan "$RUNNER_TEMP/ndi-aggregate/plan/ci-plan.json" --lockfile "$RUNNER_TEMP/ndi-aggregate/plan/Cargo.lock" --results "$RUNNER_TEMP/ndi-aggregate/evidence" --availability "$RUNNER_TEMP/ndi-aggregate/evidence" --output "$RUNNER_TEMP/ndi-aggregate/release-evidence.json"
      - name: Upload exact aggregate evidence for publication
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-evidence
          path: ${{ runner.temp }}/ndi-aggregate/release-evidence.json
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish only the validated release candidate
    needs: required-ci
    if: >-
      vars.NDI_CI_RELEASED == 'true' && needs.required-ci.result == 'success' &&
      (inputs.scope == '' || inputs.scope == 'required') &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      required-ci-passed: ${{ needs.required-ci.result == 'success' }}
    secrets:
      NDI_SDK_SOURCES_JSON: ${{ secrets.NDI_SDK_SOURCES_JSON }}
      NDI_SDK_ARCHIVE_TOKEN: ${{ secrets.NDI_SDK_ARCHIVE_TOKEN }}
      NDI_SDK_CURRENT_STANDARD_LINUX_URL: ${{ secrets.NDI_SDK_CURRENT_STANDARD_LINUX_URL }}
