name: Rust CI/CD

on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"
  NDI_SDK_URL: ${{ secrets.NDI_SDK_URL || 'https://downloads.ndi.tv/SDK/NDI_SDK/NDI%206%20SDK.exe' }}
  NDI_SDK_URL_MACOS: ${{ secrets.NDI_SDK_URL_MACOS || 'https://downloads.ndi.tv/SDK/NDI_SDK_Mac/Install_NDI_SDK_v6_Apple.pkg' }}
  NDI_SDK_URL_LINUX: ${{ secrets.NDI_SDK_URL_LINUX || 'https://downloads.ndi.tv/SDK/NDI_SDK_Linux/Install_NDI_SDK_v6_Linux.tar.gz' }}
  NDI_SDK_URL_ANDROID: ${{ secrets.NDI_SDK_URL_ANDROID || 'https://downloads.ndi.tv/SDK/NDI_SDK_Android/Install_NDI_SDK_v6_Android.tar.gz' }}
  LLVM_VERSION: "20.1.8"
  CACHE_VERSION: v1

jobs:
  # Quick format check (no dependencies needed)
  format:
    name: Format Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      # Libraries do not track Cargo.lock; resolve all optional/target dependencies.
      - run: cargo generate-lockfile
      - run: cargo audit --deny warnings

  # Combined setup and test job
  test-and-lint:
    name: Test & Lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Setup NDI SDK (Windows)
      - uses: ./.github/actions/setup-ndi-windows
        if: runner.os == 'Windows'
        with:
          save-cache: 'true'

      # Setup NDI SDK (macOS)
      - uses: ./.github/actions/setup-ndi-macos
        if: runner.os == 'macOS'
        with:
          save-cache: 'true'

      # Setup NDI SDK (Linux)
      - uses: ./.github/actions/setup-ndi-linux
        if: runner.os == 'Linux'
        with:
          save-cache: 'true'

      # Setup Rust
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Rust caching with optimizations
      - uses: Swatinem/rust-cache@v2
        with:
          # Don't cache the entire target directory, just dependencies
          cache-targets: false
          # Use a shared cache key to avoid saving the same dependencies multiple times
          shared-key: "rust-cache-${{ matrix.os }}"
          # Only save cache on main branch to avoid cache thrashing
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run receiver status SDK regression
        run: cargo test --all-features --test receiver_status_notifications -- --ignored --nocapture

      # Run all checks
      - name: Run tests
        run: |
          # First run diagnostic tests on Windows
          if [ "${{ runner.os }}" = "Windows" ]; then
            echo "Running Windows DLL diagnostics..."
            cargo test --test windows_dll_check -- --nocapture
            cargo test --test diagnose_windows_ci test_ndi_environment -- --nocapture
          fi

          # Run all tests including integration tests
          # The NDI runtime libraries are now available via the setup actions
          cargo test --all-features --verbose
        shell: bash
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Build and test examples
        run: |
          cargo build --examples
          cargo build --examples --all-features
          cargo test --examples --all-features

      - name: Run SDK lifecycle regressions
        if: runner.os == 'Linux'
        run: cargo test --all-features --test async_send_lifecycle --test sender_lifecycle_stress -- --ignored

      - name: Run video padding and FrameSync recovery SDK regression
        if: runner.os == 'Linux'
        run: cargo test --all-features --test video_padding_sdk -- --ignored --nocapture

      - name: Run FrameSync audio SDK regression
        run: cargo test --all-features --test framesync_audio_requests -- --ignored --nocapture

      - name: Check independent feature configurations
        if: runner.os == 'Linux'
        run: |
          cargo test --no-default-features
          cargo build --examples --no-default-features
          cargo test --no-default-features --features tokio
          cargo build --examples --no-default-features --features tokio
          cargo test --no-default-features --features smol
          cargo build --examples --no-default-features --features smol
          cargo test --no-default-features --features tokio,smol
          cargo build --examples --no-default-features --features tokio,smol
          cargo test
          cargo check --no-default-features --features advanced_sdk

      # Documentation lint runs once; rustdoc lints are platform-independent.
      - name: Check documentation
        if: runner.os == 'Linux'
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

  android:
    name: Android (${{ matrix.target }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ndi-linux
        with:
          platform: android
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Android NDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;27.3.13750724'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-${{ matrix.target }}
      - name: Link examples with the Android SDK
        run: scripts/build-android.sh "$NDI_TARGET"
        env:
          NDI_TARGET: ${{ matrix.target }}

  msrv:
    name: Library MSRV (Rust 1.88)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/setup-ndi-linux
        with:
          save-cache: 'false'
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --all-targets --all-features
      # Compile-diagnostic fixtures remain on stable in test-and-lint.
      - run: cargo test --lib --all-features

  # Semver check runs on all platforms
  semver:
    name: Check semver
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Setup NDI SDK (Windows)
      - uses: ./.github/actions/setup-ndi-windows
        if: runner.os == 'Windows'
        with:
          save-cache: 'false'

      # Setup NDI SDK (macOS)
      - uses: ./.github/actions/setup-ndi-macos
        if: runner.os == 'macOS'
        with:
          save-cache: 'false'

      # Setup NDI SDK (Linux)
      - uses: ./.github/actions/setup-ndi-linux
        if: runner.os == 'Linux'
        with:
          save-cache: 'false'

      - uses: dtolnay/rust-toolchain@stable

      # Rust caching - read-only, don't save
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: "rust-cache-${{ matrix.os }}"
          save-if: false  # Let test-and-lint job handle saving

      - uses: obi1kenobi/cargo-semver-checks-action@v2

  # Build and publish API documentation to GitHub Pages.
  #
  # Bindgen needs an installed NDI SDK. The docs.rs environment does not
  # include that installation, so build and host documentation from CI,
  # where the SDK is configured by the platform setup action.
  docs:
    name: Publish docs
    needs: [format, audit, test-and-lint, android, semver, msrv]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-ndi-linux
        with:
          save-cache: 'false'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: "rust-cache-ubuntu-24.04"
          save-if: false

      - name: Build documentation
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: "-D warnings"

      # docs.rs serves the crate root; replicate that with a redirect so the
      # Pages root lands on the crate documentation.
      - name: Add root redirect to crate docs
        run: echo '<meta http-equiv="refresh" content="0; url=grafton_ndi/index.html">' > target/doc/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: target/doc

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1

  # Publish job
  publish:
    name: Publish
    needs: [format, audit, test-and-lint, android, msrv, semver]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1

      # Setup NDI SDK and LLVM
      - uses: ./.github/actions/setup-ndi-windows
        with:
          save-cache: 'false'

      - uses: dtolnay/rust-toolchain@stable

      # Rust caching - read-only for publish job
      - uses: Swatinem/rust-cache@v2
        with:
          cache-targets: false
          shared-key: "rust-cache-windows-latest"
          save-if: false  # Don't save cache in publish job

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1.0.5

      - name: Publish to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
