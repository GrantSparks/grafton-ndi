name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    secrets:
      NDI_SDK_SOURCES_JSON:
        required: false
      NDI_SDK_ARCHIVE_TOKEN:
        required: false

permissions:
  contents: read

# A new push to a pull request replaces its running check. Runs for main, for
# manual dispatches and for releases are never cancelled or queued behind each other.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  ACTIONLINT_VERSION: 1.7.12
  ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

jobs:
  # The crate builds without an NDI SDK, so everything in lint, test and cross
  # runs for every event, including pull requests from forks.
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Documentation archives link to immutable commits, checked locally.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: CI scripts and workflows
        run: |
          python -m unittest discover -s ci/tests
          shellcheck ci/*.sh ci/offline/*.sh scripts/*.sh
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          for features in "" image-encoding tokio smol advanced file-io advanced,file-io; do
            cargo clippy --locked --all-targets --no-default-features ${features:+--features "$features"} -- -D warnings
          done
      - name: Bindings generator tests
        run: cargo test --locked --package xtask
      - name: Rustdoc feature combinations
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          for features in "" image-encoding tokio smol advanced file-io advanced,file-io; do
            cargo doc --locked --no-deps --no-default-features ${features:+--features "$features"}
          done
      # Build all features last: these are the HTML files checked and published.
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features
      - name: Documentation links and examples
        run: python ci/docs.py --compile --rustdoc target/doc
      - name: Redirect the site root to the API reference
        if: github.event_name == 'push' && github.repository == 'GrantSparks/grafton-ndi' && github.ref == 'refs/heads/main'
        run: |
          cat > target/doc/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <meta charset="utf-8">
          <title>grafton-ndi API reference</title>
          <meta http-equiv="refresh" content="0; url=grafton_ndi/">
          <a href="grafton_ndi/">grafton-ndi API reference</a>
          </html>
          HTML
      - name: Upload Pages artifact
        if: github.event_name == 'push' && github.repository == 'GrantSparks/grafton-ndi' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/doc
      - name: Minimum supported Rust version
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 check --locked --workspace --all-targets --all-features
      - name: Packaged crate builds
        run: |
          files=$(cargo package --list --locked --package grafton-ndi)
          if grep -E '_tests\.rs$|/tests\.rs$|test_support|test_alloc|/mock\.rs$|/sdk_tests/' <<< "$files"; then
            echo '::error::The package contains test-only sources'
            exit 1
          fi
          cargo package --locked --package grafton-ndi
      # Skipped while the crate's major version is ahead of every published
      # release: nothing constrains a new major version.
      - name: Semver check against the last release
        run: python ci/semver.py
      - name: Dependency advisories
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit --deny warnings

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # No NDI runtime is installed here: tests that need one report a skip.
      - name: Tests, all features
        run: cargo test --locked --all-features
      - name: Tests, default features
        run: |
          scope_dir="${RUNNER_TEMP:-target/ci}"
          mkdir -p "$scope_dir"
          cargo test --locked -- --list > "$scope_dir/default-tests.txt"
          python ci/sdk_test_scope.py --scope fixed-graph --inventory "$scope_dir/default-tests.txt" --output "$scope_dir/default-skips.txt"
          scope_args=()
          while IFS= read -r argument; do scope_args+=("$argument"); done < "$scope_dir/default-skips.txt"
          cargo test --locked -- "${scope_args[@]}"
      - name: Tests, File API without Advanced wrappers
        run: |
          scope_dir="${RUNNER_TEMP:-target/ci}"
          mkdir -p "$scope_dir"
          cargo test --locked --no-default-features --features file-io -- --list > "$scope_dir/file-tests.txt"
          python ci/sdk_test_scope.py --scope fixed-graph --inventory "$scope_dir/file-tests.txt" --output "$scope_dir/file-skips.txt"
          scope_args=()
          while IFS= read -r argument; do scope_args+=("$argument"); done < "$scope_dir/file-skips.txt"
          cargo test --locked --no-default-features --features file-io -- "${scope_args[@]}"
      - name: Manual measurement fixtures
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          GRAFTON_NDI_SIZES: 64x64
          GRAFTON_NDI_FORMATS: Bgra
          GRAFTON_NDI_CONTENTS: photographic
          GRAFTON_NDI_OUTPUTS: jpeg85
        run: |
          selected=$(cargo test --locked --release --all-features --lib -- --ignored --list)
          if ! grep -q ': test$' <<< "$selected"; then
            echo '::error::No tests selected for --ignored measurement fixtures'
            exit 1
          fi
          cargo test --locked --release --all-features --lib -- --ignored --test-threads=1
      - name: Memcheck over scripted capture and encoder padding
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends valgrind
          runner='target.x86_64-unknown-linux-gnu.runner=["valgrind","--tool=memcheck","--error-exitcode=99","--trace-children=yes","--trace-children-skip=*/rustc,*/rustc-*"]'
          cargo test --locked --all-features --config "$runner" --test mixed_capture_boundary --test frame_metadata_boundary -- --test-threads=1
          filters=(frames::tests::video_padding_encoders)
          for filter in "${filters[@]}"; do
            selected=$(cargo test --locked --all-features --lib -- --list "$filter")
            if ! grep -q ': test$' <<< "$selected"; then
              echo "::error::No tests selected for filter: $filter"
              exit 1
            fi
            cargo test --locked --all-features --config "$runner" --lib "$filter" -- --test-threads=1
          done

  miri:
    name: miri (${{ matrix.model }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model: [stacked, tree]
    env:
      MIRIFLAGS: ${{ matrix.model == 'tree' && '-Zmiri-tree-borrows' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned Miri toolchain
        run: |
          rustup toolchain install nightly-2026-11-10 --profile minimal --component miri,rust-src
          cargo +nightly-2026-11-10 miri setup
      - name: Initialized rows, metadata and synthetic native guards
        run: |
          inventory=$(cargo +nightly-2026-11-10 miri test --locked --lib --features advanced,file-io,image-encoding,tokio -- --list)
          tests=()
          while IFS= read -r line; do
            case "$line" in
              *': test') tests+=("${line%: test}") ;;
            esac
          done <<< "$inventory"
          select_tests() {
            local filter=$1 apply_skips=$2 test skip excluded
            selected=()
            for test in "${tests[@]}"; do
              [[ "$test" == *"$filter"* ]] || continue
              excluded=false
              if [ "$apply_skips" = true ]; then
                for skip in "${skips[@]}"; do
                  if [[ "$test" == *"$skip"* ]]; then excluded=true; break; fi
                done
              fi
              if [ "$excluded" = false ]; then selected+=("$test"); fi
            done
          }
          skips=(
            descriptor_admission_and_collection_stay_allocation_free_under_churn
            exact_copies_match_standard_utf8_replacement
            sdk_copy::tests::expanded_text_cannot_allocate_past_the_snapshot_limit
            sdk_copy::tests::omitting_malformed_entries_keeps_their_scan_cost_and_fatal_errors
            sdk_copy::tests::rejected_scans_stay_charged_and_short_budgets_are_fatal
            finder::budget::tests::aggregate_bytes_are_checked_before_string_allocation
            finder::budget::tests::count_and_span_are_checked_before_dereferencing_or_reserving
            finder::budget::tests::lossy_expansion_is_charged_before_allocating_the_output
            finder::budget::tests::rejected_entries_still_consume_the_scan_budget
          )
          skip_args=()
          for skip in "${skips[@]}"; do
            select_tests "$skip" false
            if [ "${#selected[@]}" -eq 0 ]; then
              echo "::error::No tests selected for skip: $skip"
              exit 1
            elif [ "${#selected[@]}" -ne 1 ]; then
              echo "::error::Ambiguous skip selection: $skip (${#selected[@]} matches)"
              exit 1
            fi
            skip_args+=(--skip "$skip")
          done
          # These fixtures use local/TLS state and immutable synthetic tables;
          # no selected test changes the environment or selects a native runtime.
          # Serial test cases preserve their state boundaries. Explicit worker
          # threads and the two borrowing-model processes remain independent.
          batches=(reads media ownership)
          batch_filters() {
            case "$1" in
              reads) filters=(
                sdk_copy::tests::
                source_retention::tests::
                connection_metadata::tests::
                finder::budget::tests::
                file::out_param::tests::
              );;
              media) filters=(
                frames::tests::video_padding_all_formats
                frames::tests::video_padding_single_rows
                frames::tests::video_padding_encoders
                frames::metadata_tests::metadata_constructors
                frames::metadata_tests::owned_metadata_states
                frames::metadata_tests::audio_timestamp
                receiver::mixed_tests
                receiver::latest_report_tests::
                asynchronous::scoped_tests
                framesync::tests::test_framesync_video_ref_uses
                framesync::tests::test_framesync_audio_ref_supports
                advanced::sync::tests::returned_audio_is_released
                advanced::sync::tests::borrowed_avsync_audio
              );;
              ownership) filters=(
                advanced::kvm::ownership_tests::
                advanced::reserved_map::tests::
                advanced::send_slots::tests::
                advanced::aliasable::tests::
                advanced::packets::received::tests::
                advanced::queued::boundary_tests::
                sender::in_flight::tests::
                advanced::send::tests::
                advanced::queued::tests::
                sender::tests::
              );;
              *) echo "::error::Unknown Miri batch: $1"; exit 1 ;;
            esac
          }
          selected_names=()
          for batch in "${batches[@]}"; do
            batch_filters "$batch"
            for filter in "${filters[@]}"; do
              select_tests "$filter" true
              if [ "${#selected[@]}" -eq 0 ]; then
                echo "::error::No tests selected for filter: $filter"
                exit 1
              fi
              for test in "${selected[@]}"; do
                for previous in "${selected_names[@]}"; do
                  if [ "$test" = "$previous" ]; then
                    echo "::error::Ambiguous test selection: $test ($filter)"
                    exit 1
                  fi
                done
                selected_names+=("$test")
              done
            done
          done
          echo "Selected ${#selected_names[@]} tests in ${#batches[@]} batches"
          for batch in "${batches[@]}"; do
            batch_filters "$batch"
            # --exact also affects skip matching: exclude every substring skip
            # here before supplying concrete names to the interpreter.
            batch_tests=()
            for filter in "${filters[@]}"; do
              select_tests "$filter" true
              batch_tests+=("${selected[@]}")
            done
            echo "Running Miri batch: $batch (${#batch_tests[@]} tests)"
            cargo +nightly-2026-11-10 miri test --locked --lib --features advanced,file-io,image-encoding,tokio -- --exact "${batch_tests[@]}" "${skip_args[@]}" --test-threads=1
          done

  cross:
    name: cross
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      TARGETS: >-
        aarch64-unknown-linux-gnu armv7-unknown-linux-gnueabihf i686-unknown-linux-gnu
        aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
        x86_64-pc-windows-msvc i686-pc-windows-msvc
        aarch64-apple-darwin x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Clippy for every dynamically loaded target
        run: |
          read -r -a targets <<< "$TARGETS"
          rustup target add "${targets[@]}"
          failed=()
          for target in "${targets[@]}"; do
            cargo clippy --locked --all-targets --all-features --target "$target" -- -D warnings || failed+=("$target")
          done
          if [ "${#failed[@]}" -ne 0 ]; then
            echo "::error::clippy failed for: ${failed[*]}"
            exit 1
          fi
      - name: Link the examples for Android
        run: ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME" scripts/build-android.sh aarch64-linux-android

  # This job needs the private SDK archives, so it runs only where the secrets
  # exist: not for pull requests from forks, and not for Dependabot, whose runs
  # are given none. The repository variable NDI_CI_RELEASED switches it on, and
  # required-ci treats a skip anywhere else as a failure.
  #
  # The job as a whole is the trust boundary for those secrets. Only the
  # provisioning step is given them in its environment, but every step runs on
  # the machine they were sent to, with administrator rights: the tests, every
  # build script and procedural macro in Cargo.lock, and whatever a step installs.
  #
  # No dependency cache and no uploads: SDK files and the Advanced bindings
  # generated into the target directory must stay on the runner.
  sdk:
    name: sdk (${{ matrix.name }})
    if: >-
      vars.NDI_CI_RELEASED == 'true' && github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    strategy:
      fail-fast: false
      # Primary rows own complete build/configuration checks. The two crossed
      # directions are separate runners, with both baseline editions retained
      # in each: six added jobs, including two additional macOS jobs.
      # `require` lists what the row's SDK lets an all-features build check. The
      # tests read it from GRAFTON_NDI_REQUIRE_RUNTIME and fail where they would
      # otherwise skip:
      #   1                 an NDI runtime (implied by every other entry)
      #   advanced          an Advanced runtime, compiled with its headers
      #   file              a File library the selected runtime can drive
      #   discovery-server  the SDK's Discovery Server program (Linux, 6.4)
      #   h264-decoder      an NDI|HX decoder for H.264 (built into the runtime
      #                     on macOS; on Linux, the driver package a row names
      #                     in `hx-driver`, copied beside its runtime)
      #   hevc-444-decoder  the same for HEVC 4:4:4, with a 6.4 runtime
      # Windows Advanced rows require an H.264 decoder; no Windows row requires
      # HEVC 4:4:4 decoding. These requirements configure checks, not past results.
      # Each step promises exactly what its build can check. A build without the
      # advanced and file-io features can check only `1` and `discovery-server`, so
      # the no-default-features step promises `require-no-default`, or `1` in a
      # row that does not set it.
      matrix:
        include:
          - role: primary
            name: linux-x64 standard-6.1.1
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: 6.1.1-standard-linux
            require: '1'
          - role: primary
            name: linux-x64 standard-6.3.2
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: 6.3.2-standard-linux
            require: '1'
          - role: primary
            name: linux-x64 advanced-6.3.2
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: 6.3.2-advanced-linux
            test-scope: synthetic-headers
            require: advanced
          - role: primary
            name: linux-x64 standard-6.4
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: current-standard-linux
            require: 1,discovery-server
            require-no-default: 1,discovery-server
            bindings: true
          - role: primary
            name: linux-x64 advanced-6.4
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: current-advanced-linux
            hx-driver: current-hx-driver-linux
            require: advanced,file,discovery-server,h264-decoder,hevc-444-decoder
            require-no-default: 1,discovery-server
          - role: primary
            name: linux-x86 standard-6.4
            runner: ubuntu-24.04
            target: i686-unknown-linux-gnu
            package: current-standard-linux
            require: 1,discovery-server
            require-no-default: 1,discovery-server
          - role: primary
            name: linux-arm64 standard-6.4
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package: current-standard-linux
            require: 1,discovery-server
            require-no-default: 1,discovery-server
          - role: primary
            name: windows-x64 standard-6.3.2
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            package: 6.3.2-standard-windows
            require: '1'
          - role: primary
            name: windows-x64 advanced-6.3.2
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            package: 6.3.2-advanced-windows
            test-scope: synthetic-headers
            require: advanced,h264-decoder
          - role: primary
            name: windows-x64 standard-6.4
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            package: current-standard-windows
            require: 1,file
          - role: primary
            name: windows-x64 advanced-6.4
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            package: current-advanced-windows
            require: advanced,file,h264-decoder
          - role: primary
            name: windows-x86 advanced-6.4
            runner: windows-2025
            target: i686-pc-windows-msvc
            package: current-advanced-windows
            test-scope: synthetic-headers
            require: advanced,h264-decoder
          - role: primary
            name: macos-arm64 standard-6.3.2
            runner: macos-15
            target: aarch64-apple-darwin
            package: 6.3.2-standard-apple
            require: '1'
          - role: primary
            name: macos-arm64 advanced-6.3.2
            runner: macos-15
            target: aarch64-apple-darwin
            package: 6.3.2-advanced-apple
            test-scope: synthetic-headers
            require: advanced,h264-decoder
          - role: primary
            name: macos-arm64 standard-6.4
            runner: macos-15
            target: aarch64-apple-darwin
            package: current-standard-apple
            require: '1'
            apple-mobile: true
          - role: primary
            name: macos-arm64 advanced-6.4
            runner: macos-15
            target: aarch64-apple-darwin
            package: current-advanced-apple
            require: advanced,file,h264-decoder,hevc-444-decoder
            apple-mobile: true
          - role: primary
            name: macos-x64 standard-6.4
            runner: macos-15-intel
            target: x86_64-apple-darwin
            package: current-standard-apple
            require: '1'
          - role: current-headers
            name: linux-x64 current-headers
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: current-advanced-linux
            compatibility: 6.1.1-standard-linux
            compatibility-advanced: 6.3.2-advanced-linux
            require: advanced,file,discovery-server,h264-decoder,hevc-444-decoder
            hx-driver: current-hx-driver-linux
          - role: baseline-headers
            name: linux-x64 baseline-headers
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package: current-advanced-linux
            compatibility: 6.1.1-standard-linux
            compatibility-advanced: 6.3.2-advanced-linux
            require: advanced,file,discovery-server,h264-decoder,hevc-444-decoder
            hx-driver: current-hx-driver-linux
          - role: current-headers
            name: windows-x64 current-headers
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            package: current-advanced-windows
            compatibility: 6.3.2-standard-windows
            compatibility-advanced: 6.3.2-advanced-windows
            require: advanced,file,h264-decoder
          - role: baseline-headers
            name: windows-x64 baseline-headers
            runner: windows-2025
            target: x86_64-pc-windows-msvc
            package: current-advanced-windows
            compatibility: 6.3.2-standard-windows
            compatibility-advanced: 6.3.2-advanced-windows
            require: advanced,file,h264-decoder
          - role: current-headers
            name: macos-arm64 current-headers
            runner: macos-15
            target: aarch64-apple-darwin
            package: current-advanced-apple
            compatibility: 6.3.2-standard-apple
            compatibility-advanced: 6.3.2-advanced-apple
            require: advanced,file,h264-decoder,hevc-444-decoder
          - role: baseline-headers
            name: macos-arm64 baseline-headers
            runner: macos-15
            target: aarch64-apple-darwin
            package: current-advanced-apple
            compatibility: 6.3.2-standard-apple
            compatibility-advanced: 6.3.2-advanced-apple
            require: advanced,file,h264-decoder,hevc-444-decoder
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      TARGET: ${{ matrix.target }}
      PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.100.0
          targets: ${{ matrix.target }}
          components: clippy, rustfmt
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap libavahi-client3
          # Ubuntu 24.04 denies the unprivileged user namespace that bwrap needs.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # Only the Advanced headers and the bindings check run bindgen.
      - name: Linux libclang
        if: runner.os == 'Linux' && (contains(matrix.package, 'advanced') || matrix.bindings)
        run: |
          # The bindings check includes visionOS, whose Clang triple is xros.
          sudo apt-get install --yes --no-install-recommends libclang-19-dev
          echo 'LIBCLANG_PATH=/usr/lib/llvm-19/lib' >> "$GITHUB_ENV"
      - name: 32-bit Linux linker and runtime dependencies
        if: matrix.target == 'i686-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-multilib libc6-dev:i386 libavahi-client3:i386
      - name: Windows libclang
        if: runner.os == 'Windows' && contains(matrix.package, 'advanced')
        shell: pwsh
        run: |
          if (!(Test-Path 'C:\Program Files\LLVM\bin\clang.exe')) { choco install llvm --version=20.1.8 -y }
          'LIBCLANG_PATH=C:\Program Files\LLVM\bin' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: NDI HX fixture encoder
        if: contains(matrix.package, 'advanced')
        run: |
          if ! command -v ffmpeg >/dev/null; then
            case "$RUNNER_OS" in
              Linux) sudo apt-get install --yes --no-install-recommends ffmpeg ;;
              macOS) brew install ffmpeg ;;
              Windows) choco install ffmpeg --no-progress -y ;;
            esac
          fi
      # The only step that is given the acquisition secrets. It exports
      # NDI_SDK_DIR and NDI_RUNTIME_DIR_V6 for the steps that follow, and copies
      # a row's `hx-driver` beside that runtime. The compatibility runs' baseline
      # runtimes get none: those runs promise no decoder, and a driver is pinned
      # together with the SDK release of its own build.
      - name: Provision the SDK
        id: sdk
        env:
          NDI_SDK_SOURCES_JSON: ${{ secrets.NDI_SDK_SOURCES_JSON }}
          NDI_SDK_ARCHIVE_TOKEN: ${{ secrets.NDI_SDK_ARCHIVE_TOKEN }}
        run: |
          python ci/sdk.py install "$PACKAGE" --dest "$RUNNER_TEMP/ndi-sdk" --target "$TARGET" --github-env "$GITHUB_ENV" --github-output "$GITHUB_OUTPUT"
          if [ -n "${{ matrix.hx-driver }}" ]; then
            python ci/sdk.py install-driver "${{ matrix.hx-driver }}" --sdk "$RUNNER_TEMP/ndi-sdk" --target "$TARGET"
          fi
          if [ "${{ matrix.role }}" != primary ]; then
            python ci/sdk.py install "${{ matrix.compatibility }}" --dest "$RUNNER_TEMP/ndi-compat" --target "$TARGET" --github-env "$RUNNER_TEMP/ndi-compat-standard.env"
            python ci/sdk.py install "${{ matrix.compatibility-advanced }}" --dest "$RUNNER_TEMP/ndi-compat-advanced" --target "$TARGET" --github-env "$RUNNER_TEMP/ndi-compat-advanced.env"
          fi
      # Windows has no test runner to check: its tests run unconfined
      # (ci/README.md, "Loopback-only test runs").
      - name: Test runner leaves loopback networking only
        id: isolation
        run: |
          case "$RUNNER_OS" in
            Linux) python ci/offline/check.py --online && ci/offline/linux.sh python3 ci/offline/check.py ;;
            macOS) python ci/offline/check.py --online && ci/offline/macos.sh python3 ci/offline/check.py ;;
            Windows) echo 'Windows runs the runtime tests without a loopback-only runner.' ;;
          esac
      # Each runtime step is bounded inside the job's limit, so a test that
      # never returns fails its step. Every test binary runs, so one failing
      # does not hide the rest. Every step from here on runs
      # whatever the steps before it did, once the runner was shown to isolate:
      # a run then reports everything that is wrong with a row, not the first
      # thing.
      - name: Tests against the real runtime, all features
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' && matrix.role == 'primary' }}
        timeout-minutes: 20
        env:
          GRAFTON_NDI_REQUIRE_RUNTIME: ${{ matrix.require }}
        run: |
          skip_args=()
          if [ "${{ matrix.test-scope }}" = synthetic-headers ]; then
            # These fixed synthetic headers have a full owner in the current
            # Advanced primary row for the compiler host, independent of this SDK.
            inventory="$RUNNER_TEMP/ndi-primary-tests.txt"
            skip_file="$RUNNER_TEMP/ndi-primary-skips.txt"
            cargo test --locked --config ci/offline.toml --target "$TARGET" --no-fail-fast --all-features -- --list > "$inventory"
            python ci/sdk_test_scope.py --scope synthetic-headers --inventory "$inventory" --output "$skip_file"
            while IFS= read -r argument; do skip_args+=("$argument"); done < "$skip_file"
          fi
          cargo test --locked --config ci/offline.toml --target "$TARGET" --no-fail-fast --all-features -- "${skip_args[@]}"
      - name: Tests against the real runtime, no default features
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' && matrix.role == 'primary' }}
        timeout-minutes: 10
        env:
          GRAFTON_NDI_REQUIRE_RUNTIME: ${{ matrix.require-no-default || '1' }}
        run: cargo test --locked --config ci/offline.toml --target "$TARGET" --no-fail-fast --no-default-features
      - name: Memcheck over SDK padding
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' && matrix.name == 'linux-x64 standard-6.3.2' }}
        timeout-minutes: 10
        env:
          GRAFTON_NDI_REQUIRE_RUNTIME: '1'
        run: |
          sudo apt-get install --yes --no-install-recommends valgrind
          cargo test --locked --config ci/offline.toml --config 'target.x86_64-unknown-linux-gnu.runner=["ci/offline/linux.sh","valgrind","--tool=memcheck","--track-origins=yes","--error-exitcode=99","--suppressions=ci/valgrind.supp"]' --target "$TARGET" --no-fail-fast --features image-encoding --test video_padding_sdk -- --test-threads=1
      # Without the Advanced headers the advanced feature compiles to stubs, so
      # only a build that has them lints and documents the real implementation.
      - name: Lint and document the Advanced implementation
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' && matrix.role == 'primary' && contains(matrix.package, 'advanced') }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          rustup toolchain install 1.88.0 --profile minimal --target "$TARGET"
          cargo +1.88.0 check --locked --all-targets --target "$TARGET" --all-features
          cargo clippy --locked --all-targets --target "$TARGET" --all-features -- -D warnings
          cargo clippy --locked --all-targets --target "$TARGET" --no-default-features --features advanced -- -D warnings
          cargo clippy --locked --all-targets --target "$TARGET" --no-default-features --features advanced,file-io -- -D warnings
          cargo doc --locked --no-deps --target "$TARGET" --all-features
      - name: Vendored bindings are current
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' && matrix.bindings }}
        run: cargo xtask bindgen --check --sdk "$NDI_SDK_DIR"
      - name: Build for the statically linked Apple mobile targets
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' && matrix.apple-mobile }}
        run: ci/apple-mobile.sh

      - name: Current Advanced headers with baseline runtimes
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' && matrix.role == 'current-headers' }}
        timeout-minutes: 25
        run: |
          export GRAFTON_NDI_PEER_RUNTIME="${{ steps.sdk.outputs.GRAFTON_NDI_EXPECTED_RUNTIME }}"
          export GRAFTON_NDI_PEER_VERSION="${{ steps.sdk.outputs.GRAFTON_NDI_EXPECTED_VERSION }}"
          export GRAFTON_NDI_PEER_EDITION="${{ steps.sdk.outputs.GRAFTON_NDI_EXPECTED_EDITION }}"
          # Compiler fixtures are owned by the primary row for this target and
          # header package. Validate exact skips against this compiled inventory.
          inventory="$RUNNER_TEMP/ndi-current-headers-tests.txt"
          skip_file="$RUNNER_TEMP/ndi-current-headers-skips.txt"
          cargo test --locked --config ci/offline.toml --target "$TARGET" --no-fail-fast --all-features -- --list > "$inventory"
          python ci/sdk_test_scope.py --inventory "$inventory" --target "$TARGET" --headers advanced --output "$skip_file"
          skip_args=()
          while IFS= read -r argument; do skip_args+=("$argument"); done < "$skip_file"
          failed=0
          for edition in standard advanced; do
            while IFS='=' read -r name value; do export "$name=$value"; done < "$RUNNER_TEMP/ndi-compat-$edition.env"
            export NDI_SDK_DIR="${{ steps.sdk.outputs.NDI_SDK_DIR }}"
            if [ "$edition" = advanced ]; then export GRAFTON_NDI_REQUIRE_RUNTIME=advanced; else export GRAFTON_NDI_REQUIRE_RUNTIME=1; fi
            cargo test --locked --config ci/offline.toml --target "$TARGET" --no-fail-fast --all-features -- "${skip_args[@]}" || failed=1
          done
          exit "$failed"
      # A Standard baseline SDK has no headers a build reads, so its pass is a
      # build without Advanced declarations, which cannot check `advanced`. No
      # compatibility pass promises an NDI|HX decoder; the row's own runs do.
      - name: Baseline SDK builds with the current Advanced runtime
        if: ${{ !cancelled() && steps.isolation.outcome == 'success' && matrix.role == 'baseline-headers' }}
        timeout-minutes: 25
        run: |
          failed=0
          for edition in standard advanced; do
            while IFS='=' read -r name value; do export "$name=$value"; done < "$RUNNER_TEMP/ndi-compat-$edition.env"
            export GRAFTON_NDI_PEER_RUNTIME="$GRAFTON_NDI_EXPECTED_RUNTIME"
            export GRAFTON_NDI_PEER_VERSION="$GRAFTON_NDI_EXPECTED_VERSION"
            export GRAFTON_NDI_PEER_EDITION="$GRAFTON_NDI_EXPECTED_EDITION"
            export NDI_RUNTIME_DIR_V6="${{ steps.sdk.outputs.NDI_RUNTIME_DIR_V6 }}"
            export GRAFTON_NDI_EXPECTED_RUNTIME="${{ steps.sdk.outputs.GRAFTON_NDI_EXPECTED_RUNTIME }}"
            export GRAFTON_NDI_EXPECTED_VERSION="${{ steps.sdk.outputs.GRAFTON_NDI_EXPECTED_VERSION }}"
            export GRAFTON_NDI_EXPECTED_EDITION="${{ steps.sdk.outputs.GRAFTON_NDI_EXPECTED_EDITION }}"
            require="${{ matrix.require }}"
            require="${require/,h264-decoder/}"; require="${require/,hevc-444-decoder/}"
            if [ "$edition" = standard ]; then require="${require/advanced/1}"; fi
            export GRAFTON_NDI_REQUIRE_RUNTIME="$require"
            inventory="$RUNNER_TEMP/ndi-baseline-$edition-tests.txt"
            skip_file="$RUNNER_TEMP/ndi-baseline-$edition-skips.txt"
            cargo test --locked --config ci/offline.toml --target "$TARGET" --no-fail-fast --all-features -- --list > "$inventory" || { failed=1; continue; }
            python ci/sdk_test_scope.py --inventory "$inventory" --target "$TARGET" --headers "$edition" --output "$skip_file" || { failed=1; continue; }
            skip_args=()
            while IFS= read -r argument; do skip_args+=("$argument"); done < "$skip_file"
            cargo test --locked --config ci/offline.toml --target "$TARGET" --no-fail-fast --all-features -- "${skip_args[@]}" || failed=1
          done
          exit "$failed"

  required-ci:
    name: required-ci
    if: always()
    needs: [lint, test, cross, sdk, miri]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Every job this event requires succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          # The condition of the sdk job, without the switch that turns it on.
          SDK_EXPECTED: >-
            ${{ github.actor != 'dependabot[bot]' &&
            (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        run: python3 ci/gate.py

  deploy-docs:
    name: publish documentation
    needs: required-ci
    if: ${{ !cancelled() && needs.required-ci.result == 'success' && github.event_name == 'push' && github.repository == 'GrantSparks/grafton-ndi' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
