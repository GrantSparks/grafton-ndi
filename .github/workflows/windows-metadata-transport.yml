name: Windows metadata workaround comparison

on:
  push:
    branches: [receiver-diagnostic-windows-metadata-workarounds]

permissions:
  contents: read

jobs:
  native:
    if: github.repository == 'GrantSparks/grafton-ndi'
    runs-on: windows-2025
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        package: [6.3.2-standard-windows, current-standard-windows]
        mode: [named-observed, name-only, register-live, send-live]
    env:
      PACKAGE: ${{ matrix.package }}
      MODE: ${{ matrix.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - name: Install the pinned Standard Windows SDK
        env:
          NDI_SDK_SOURCES_JSON: ${{ secrets.NDI_SDK_SOURCES_JSON }}
          NDI_SDK_ARCHIVE_TOKEN: ${{ secrets.NDI_SDK_ARCHIVE_TOKEN }}
        shell: pwsh
        run: python ci/sdk.py install $env:PACKAGE --dest "$env:RUNNER_TEMP/ndi-runtime" --target x86_64-pc-windows-msvc --github-env "$env:GITHUB_ENV"
      - name: Exercise native registration delivery
        shell: pwsh
        run: |
          $include = Get-ChildItem -LiteralPath $env:NDI_SDK_DIR -Recurse -Filter Processing.NDI.Lib.h | Select-Object -First 1
          $library = Get-ChildItem -LiteralPath $env:NDI_SDK_DIR -Recurse -Filter Processing.NDI.Lib.x64.lib | Select-Object -First 1
          if (!$include -or !$library) { throw 'Native C SDK files are unavailable' }
          $installer = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $visualStudio = & $installer -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $env:NDI_PROBE_VCVARS = Join-Path $visualStudio 'VC/Auxiliary/Build/vcvars64.bat'
          $env:NDI_PROBE_INCLUDE = $include.Directory.FullName
          $env:NDI_PROBE_LIB = $library.FullName
          $script = Join-Path $env:RUNNER_TEMP 'metadata-probe.cmd'
          @'
          @echo off
          call "%NDI_PROBE_VCVARS%"
          if errorlevel 1 exit /b 1
          cl /nologo /std:c11 /W4 /I"%NDI_PROBE_INCLUDE%" ci\metadata_native_probe.c "%NDI_PROBE_LIB%" /Fe:"%RUNNER_TEMP%\metadata-probe.exe"
          if errorlevel 1 exit /b 1
          set "PATH=%NDI_RUNTIME_DIR_V6%;%PATH%"
          "%RUNNER_TEMP%\metadata-probe.exe" %MODE% 16 3
          '@ | Set-Content -LiteralPath $script -Encoding ascii
          & cmd.exe /d /c $script
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
