name: Publish validated release outputs

on:
  workflow_call:
    inputs:
      required-ci-passed:
        type: boolean
        required: true
    secrets:
      NDI_SDK_SOURCES_JSON:
        required: false
      NDI_SDK_ARCHIVE_TOKEN:
        required: false
      NDI_SDK_CURRENT_STANDARD_LINUX_URL:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  NDI_CI_RELEASED: ${{ vars.NDI_CI_RELEASED }}
  NDI_REQUIRED_CI_PASSED: ${{ inputs.required-ci-passed }}

jobs:
  docs-build:
    name: Prepare public API documentation
    if: >-
      inputs.required-ci-passed && vars.NDI_CI_RELEASED == 'true' &&
      github.repository == 'GrantSparks/grafton-ndi' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-plan
          path: ${{ runner.temp }}/publication-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-evidence
          path: ${{ runner.temp }}/publication-evidence
      - run: sudo apt-get update && sudo apt-get install --yes clang llvm
      - name: Verify same-run evidence and build source-free public docs
        env:
          NDI_SDK_SOURCES_JSON: ${{ secrets.NDI_SDK_SOURCES_JSON }}
          NDI_SDK_ARCHIVE_TOKEN: ${{ secrets.NDI_SDK_ARCHIVE_TOKEN }}
          NDI_SDK_SOURCE_URL: ${{ secrets.NDI_SDK_CURRENT_STANDARD_LINUX_URL }}
        run: >-
          python ci/publish.py docs
          --work "$RUNNER_TEMP/publication-work"
          --plan "$RUNNER_TEMP/publication-plan/ci-plan.json"
          --report "$RUNNER_TEMP/publication-evidence/release-evidence.json"
          --lockfile "$RUNNER_TEMP/publication-plan/Cargo.lock"
          --stage "$RUNNER_TEMP/public-docs"
      # Only this audited source-free tree is uploaded. SDKs, OUT_DIR bindings,
      # package archives, native binaries, acquisition receipts and raw logs stay local.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/public-docs
      - name: Remove private build inputs and diagnostics
        if: always()
        run: python -c "import os,pathlib,shutil; shutil.rmtree(pathlib.Path(os.environ['RUNNER_TEMP'])/'publication-work', ignore_errors=True)"

  docs-deploy:
    name: Deploy validated documentation
    needs: docs-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy public documentation artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  crate-publish:
    name: Publish version-matched crate
    if: >-
      inputs.required-ci-passed && vars.NDI_CI_RELEASED == 'true' &&
      github.repository == 'GrantSparks/grafton-ndi' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ci-plan
          path: ${{ runner.temp }}/publication-plan
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-evidence
          path: ${{ runner.temp }}/publication-evidence
      - run: sudo apt-get update && sudo apt-get install --yes clang llvm
      - name: Verify release identity, tag version and exact crate contents
        env:
          NDI_SDK_SOURCES_JSON: ${{ secrets.NDI_SDK_SOURCES_JSON }}
          NDI_SDK_ARCHIVE_TOKEN: ${{ secrets.NDI_SDK_ARCHIVE_TOKEN }}
          NDI_SDK_SOURCE_URL: ${{ secrets.NDI_SDK_CURRENT_STANDARD_LINUX_URL }}
        run: >-
          python ci/publish.py package
          --work "$RUNNER_TEMP/publication-work"
          --plan "$RUNNER_TEMP/publication-plan/ci-plan.json"
          --report "$RUNNER_TEMP/publication-evidence/release-evidence.json"
          --lockfile "$RUNNER_TEMP/publication-plan/Cargo.lock"
      - name: Authenticate with crates.io after all preparation passes
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Revalidate and publish the prepared crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: >-
          python ci/publish.py publish
          --work "$RUNNER_TEMP/publication-work"
          --plan "$RUNNER_TEMP/publication-plan/ci-plan.json"
          --report "$RUNNER_TEMP/publication-evidence/release-evidence.json"
          --lockfile "$RUNNER_TEMP/publication-plan/Cargo.lock"
      - name: Remove private SDK, package, target and raw logs
        if: always()
        run: python -c "import os,pathlib,shutil; shutil.rmtree(pathlib.Path(os.environ['RUNNER_TEMP'])/'publication-work', ignore_errors=True)"
