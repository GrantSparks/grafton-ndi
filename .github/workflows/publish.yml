name: Publish

# A `v<version>` tag on a commit of main publishes that version to crates.io.
# docs.rs builds the API documentation from the published crate.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: release tag
    if: github.repository == 'GrantSparks/grafton-ndi'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag names the crate version and its commit is on main
        run: |
          python3 ci/release.py "$GITHUB_REF_NAME"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "::error::$GITHUB_REF_NAME does not point at a commit of main"
            exit 1
          fi

  ci:
    name: ci
    needs: release
    uses: ./.github/workflows/rust.yml
    secrets:
      NDI_SDK_SOURCES_JSON: ${{ secrets.NDI_SDK_SOURCES_JSON }}
      NDI_SDK_ARCHIVE_TOKEN: ${{ secrets.NDI_SDK_ARCHIVE_TOKEN }}

  # Builds the packaged crate, including every dependency build script, in a
  # job that cannot obtain a registry token.
  verify:
    name: verify package
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Package and build the packaged crate
        run: |
          cargo package --locked --package grafton-ndi
          mkdir "$RUNNER_TEMP/release"
          cp target/package/grafton-ndi-*.crate "$RUNNER_TEMP/release/"
          cd "$RUNNER_TEMP/release"
          sha256sum grafton-ndi-*.crate > SHA256SUMS
          rustc --version | cut -d' ' -f2 > toolchain
          cat SHA256SUMS toolchain
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: crate
          path: ${{ runner.temp }}/release
          if-no-files-found: error
          retention-days: 7

  # Holds the crates.io trusted-publishing identity, so it compiles nothing:
  # it re-creates the package without building it, requires the bytes to equal
  # the verified package, and uploads.
  publish:
    name: publish to crates.io
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: crate
          path: ${{ runner.temp }}/release
      - name: Re-create the verified package
        run: |
          toolchain=$(cat "$RUNNER_TEMP/release/toolchain")
          [[ "$toolchain" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          rustup toolchain install "$toolchain" --profile minimal
          echo "RUSTUP_TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"
          RUSTUP_TOOLCHAIN="$toolchain" cargo package --locked --no-verify --package grafton-ndi
          cd target/package
          sha256sum --check "$RUNNER_TEMP/release/SHA256SUMS"
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify --package grafton-ndi
